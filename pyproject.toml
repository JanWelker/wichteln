[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "wichteln"
version = "0.1.0"
description = "Self-hosted family Secret Santa draw"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography>=50"]

[project.scripts]
wichteln = "wichteln.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_keychain: run keychain.py itself, with only subprocess.run replaced"]

[tool.coverage.run]
branch = true
source = ["wichteln"]

[tool.uv]
required-version = ">=0.8"
