{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header bg-success text-white">Neue Wichtel-Runde</div>
            <div class="card-body">
                <form method="POST" action="/">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name der Runde</label>
                        <input type="text" class="form-control" id="name" name="name"
                            placeholder="z.B. Weihnachten 2024" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Erstellen</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <h3>Vorhandene Runden</h3>
        {% if rounds %}
        <div class="list-group">
            {% for round in rounds %}
            <a href="{{ url_for('view_round', round_id=round.id) }}"
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                {{ round.name }}
                <span class="badge bg-secondary rounded-pill">{{ round.participants|length }} Teilnehmer</span>
            </a>
            {% endfor %}
        </div>
        {% else %}
        <p class="text-muted">Noch keine Runden erstellt.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
