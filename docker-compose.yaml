services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/wichteln
      - FLASK_APP=app.py
      - FLASK_DEBUG=1
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=wichteln
    volumes:
      - app_db_data:/var/lib/postgresql/data

volumes:
  app_db_data:
